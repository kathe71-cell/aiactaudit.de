              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Die Verordnung (EU) 2024/1689 trat am 1. August 2024 in Kraft. Die Verbote für unannehmbare Risiken greifen nach 6 Monaten (Februar 2025). Pflichten für KI-Modelle mit allgemeinem Verwendungszweck (GPAI) gelten nach 12 Monaten (August 2025). Die meisten Hochrisiko-Regeln greifen nach 24 Monaten (August 2026), bestimmte Anhang-I-Systeme nach 36 Monaten (August 2027)."
              }

              "@type": "Question",
              "name": "Welche KI-Praktiken sind nach Art. 5 strikt verboten?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Verboten sind unter anderem: Social Scoring, kognitive Verhaltensmanipulation mit Schadensfolge, ungezieltes Auslesen von Gesichtsbildern (Scraping) sowie Emotionserkennung am Arbeitsplatz und in Bildungseinrichtungen."
              }
            },
            {
              "@type": "Question",
              "name": "Was unterscheidet Anbieter (Provider) und Betreiber (Deployer)?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Anbieter (Provider) entwickeln oder vertreiben ein KI-System unter eigenem Namen. Sie tragen die primären Pflichten (Konformitätsbewertung, CE-Kennzeichnung, technische Dokumentation). Betreiber (Deployer) setzen das System im geschäftlichen Kontext ein und müssen menschliche Aufsicht, Betriebsprotokolle und Nutzungsmonitoring gewährleisten."
              }
            },
            {
              "@type": "Question",
              "name": "Welche Pflichten gelten für Hochrisiko-KI nach Art. 9–15?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Für Hochrisiko-Systeme gelten 7 Kernanforderungen: (1) Risikomanagementsystem (Art. 9), (2) Daten-Governance & Trainingsdatenqualität (Art. 10), (3) Technische Dokumentation (Art. 11), (4) Automatische Protokollierung/Logging (Art. 12), (5) Transparenz & Nutzerinformation (Art. 13), (6) Menschliche Aufsicht (Art. 14) und (7) Genauigkeit, Robustheit & Cybersicherheit (Art. 15)."
              }
            },
