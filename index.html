                "@type": "Answer",
                "text": "Die Verordnung (EU) 2024/1689 trat am 1. August 2024 in Kraft. Die Verbote für unannehmbare Risiken greifen seit dem 2. Februar 2025 (Stufe 1). Vorgaben für GPAI-Modelle (Kapitel V) gelten seit dem 2. August 2025 (Stufe 2). Die Hochrisiko-Regeln nach Anhang III werden zum 2. August 2026 wirksam (Stufe 3), harmonisierte Altprodukte nach Anhang I folgen zum 2. August 2027 (Stufe 4)."
