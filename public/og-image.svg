<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>
  
  <!-- Subtle tech grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="200" cy="150" r="300" fill="url(#emeraldGlow)"/>

  <!-- Logo container -->
  <g transform="translate(100, 90)">
    <rect width="90" height="90" rx="24" fill="#020617" stroke="#1e293b" stroke-width="2"/>
    <!-- Shield Icon -->
    <path d="M45 18L24 27V45C24 58.5 33 70.5 45 74C57 70.5 66 58.5 66 45V27L45 18Z" fill="#1e293b" stroke="#10b981" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="45" cy="38" r="5" fill="#10b981"/>
    <path d="M45 43V50" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <circle cx="34" cy="52" r="3" fill="#38bdf8"/>
    <circle cx="56" cy="52" r="3" fill="#38bdf8"/>
    <path d="M34 52L45 50L56 52" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M36 60L43 65L54 55" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Title -->
  <text x="215" y="145" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">AI Act Audit</text>
  <rect x="495" y="112" width="60" height="34" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="508" y="135" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="800" fill="#a7f3d0">.de</text>

  <!-- Tagline Badge -->
  <rect x="100" y="230" width="370" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="120" cy="250" r="5" fill="#10b981"/>
  <text x="135" y="256" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#94a3b8">VERORDNUNG (EU) 2024/1689</text>

  <!-- Main Headline -->
  <text x="100" y="340" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="56" font-weight="900" fill="#f8fafc" letter-spacing="-1.5">
    EU AI Act Konformitäts- &amp;
  </text>
  <text x="100" y="405" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="56" font-weight="900" fill="#34d399" letter-spacing="-1.5">
    Audit-Readiness Portal
  </text>

  <!-- Subheadline -->
  <text x="100" y="470" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Risikoklassen-Klassifizierung • Prüfmatrix (Art. 9–15) • Bußgeld-Kalkulator • Fristen 2024–2027
  </text>

  <!-- Bottom Badges / Metrics -->
  <g transform="translate(100, 520)">
    <rect width="210" height="60" rx="14" fill="#020617" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748b" text-transform="uppercase">Risikostufen</text>
    <text x="20" y="49" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="800" fill="#ffffff">4 Stufen (Art. 5–6)</text>
  </g>

  <g transform="translate(330, 520)">
    <rect width="230" height="60" rx="14" fill="#020617" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748b" text-transform="uppercase">Hochrisiko-Pflichten</text>
    <text x="20" y="49" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="800" fill="#34d399">Art. 9 bis 15</text>
  </g>

  <g transform="translate(580, 520)">
    <rect width="230" height="60" rx="14" fill="#020617" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748b" text-transform="uppercase">Max. Bußgelder</text>
    <text x="20" y="49" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="800" fill="#fbbf24">Bis 35 Mio. € / 7 %</text>
  </g>

  <g transform="translate(830, 520)">
    <rect width="270" height="60" rx="14" fill="#020617" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748b" text-transform="uppercase">Interaktiver Check</text>
    <text x="20" y="49" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="800" fill="#38bdf8">Readiness-Score &amp; GAP</text>
  </g>
</svg>
